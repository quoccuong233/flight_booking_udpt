global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: services
    static_configs:
      - targets:
          - auth:3000
          - flight:3000
          - search-1:3000
          - search-2:3000
          - booking:3000
          - payment:3000
          - notification:3000

  - job_name: kong
    static_configs:
      - targets: [kong:8100]

  - job_name: rabbitmq
    metrics_path: /metrics/per-object
    static_configs:
      - targets: [rabbitmq:15692]

  - job_name: postgres
    static_configs:
      - targets:
          - postgres-exporter-main:9187
          - postgres-exporter-replica:9187

  - job_name: redis
    static_configs:
      - targets: [redis-exporter:9121]

  - job_name: cadvisor
    static_configs:
      - targets: [cadvisor:8080]
