server {
    listen 8080;
    root /usr/share/nginx/html;

    # Kong sends /api to the services. An /api path that reaches here matched no route,
    # so answer 404 instead of returning the app's HTML with 200.
    location /api/ {
        return 404;
    }

    # Built assets have a content hash in their name and never change.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # React Router handles client-side paths such as /bookings.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
